<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AforoYa · Aforo de gimnasios en Madrid</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="cabecera">
    <a class="marca" href="index.html">Aforo<span>Ya</span></a>
    <nav class="nav">
      <a href="index.html" aria-current="page">Gimnasios</a>
      <a href="recepcion.html">Recepción</a>
    </nav>
  </header>

  <main class="contenedor">
    <section class="intro">
      <h1>¿Cuánta gente hay ahora en tu gimnasio?</h1>
      <p>Aforo en tiempo real de los gimnasios de Madrid. Mira el semáforo antes de salir de casa.</p>
    </section>

    <div class="barra-herramientas">
      <div class="filtros" role="group" aria-label="Filtrar por estado">
        <button class="filtro" data-filtro="todos" aria-pressed="true">Todos</button>
        <button class="filtro" data-filtro="verde" aria-pressed="false"><span class="punto verde"></span>Tranquilo</button>
        <button class="filtro" data-filtro="amarillo" aria-pressed="false"><span class="punto amarillo"></span>Moderado</button>
        <button class="filtro" data-filtro="rojo" aria-pressed="false"><span class="punto rojo"></span>Lleno</button>
      </div>
      <p class="actualizado" id="actualizado" aria-live="polite"></p>
    </div>

    <ul class="lista" id="lista"></ul>
    <p class="vacio" id="vacio" hidden>Ningún gimnasio en este estado ahora mismo.</p>
  </main>

  <script src="js/datos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
