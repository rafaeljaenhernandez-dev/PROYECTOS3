<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AforoYa · Recepción</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="cabecera">
    <a class="marca" href="index.html">Aforo<span>Ya</span></a>
    <nav class="nav">
      <a href="index.html">Gimnasios</a>
      <a href="recepcion.html" aria-current="page">Recepción</a>
    </nav>
  </header>

  <main class="contenedor recepcion">
    <label class="selector">
      <span>Gimnasio</span>
      <select id="gimnasio"></select>
    </label>

    <section class="panel" id="panel" aria-live="polite">
      <p class="estado grande"><span class="punto" id="punto"></span><span id="estado-texto"></span></p>
      <p class="contador"><strong id="dentro">0</strong><span id="capacidad">/ 0</span></p>
      <p class="contador-pie">personas dentro · <span id="porcentaje">0</span>% del aforo</p>
      <div class="medidor grande" role="meter" aria-valuemin="0" aria-valuemax="100" id="medidor">
        <div class="medidor-relleno" id="relleno"></div>
      </div>
    </section>

    <div class="acciones">
      <button class="accion salida" id="salida">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
        Salida
      </button>
      <button class="accion entrada" id="entrada">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Entrada
      </button>
    </div>
    <p class="aviso" id="aviso" hidden></p>

    <section class="movimientos">
      <h2>Últimos movimientos</h2>
      <ol id="registro"></ol>
      <p class="vacio" id="registro-vacio">Todavía no hay movimientos en este gimnasio.</p>
    </section>
  </main>

  <script src="js/datos.js"></script>
  <script src="js/recepcion.js"></script>
</body>
</html>
